{{- if .Values.networkPolicy.enabled }}
# Ingress: only to the HTTP port. Egress: DNS, and HTTPS (the model API and AWS endpoints).
# Nothing else in the cluster can be reached from these pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kestrel.name" . }}
  labels: {{- include "kestrel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kestrel.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
