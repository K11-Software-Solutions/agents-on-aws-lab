{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.remoteKey }}{{ fail "externalSecret.remoteKey is required (terraform output api_key_secret_arn)" }}{{ end }}
# Syncs the API key from AWS Secrets Manager into a Kubernetes Secret (External Secrets Operator).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.model.apiKeySecret.name }}
  labels: {{- include "kestrel.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: {{ .Values.model.apiKeySecret.name }}
  data:
    - secretKey: {{ .Values.model.apiKeySecret.key }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
{{- end }}
